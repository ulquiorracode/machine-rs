[package]
name = "machine-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Universal State Machine Kernel for Rust: Unifying Generators, Iterators, and Algebraic Effects"
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = ["std"]
std = ["machine-core/std"]
async = ["dep:machine-async"]

[dependencies]
machine-core = { workspace = true }
machine-async = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "generator_bench"
harness = false
