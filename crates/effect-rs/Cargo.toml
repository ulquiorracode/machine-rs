[package]
name = "effect-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Algebraic Effects in Rust: Uncolored, Zero-Cost, Monomorphic State Machines"
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = ["std"]
std = ["effect-core/std"]
async = ["dep:effect-async"]

[dependencies]
effect-core = { workspace = true }
effect-async = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "baseline_bench"
harness = false
