[workspace]
members = [
    "crates/effect-core",
    "crates/effect-async",
    "crates/effect-rs",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["UlquiorraCode Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ulquiorracode/effect-rs"
keywords = ["effects", "algebraic-effects", "coroutines", "zero-cost", "no-std"]
categories = ["rust-patterns", "asynchronous", "no-std"]

[workspace.dependencies]
effect-core = { path = "crates/effect-core", version = "0.1.0" }
effect-async = { path = "crates/effect-async", version = "0.1.0" }
effect-rs = { path = "crates/effect-rs", version = "0.1.0" }

criterion = "0.5"
tokio = { version = "1.43", default-features = false, features = ["macros", "rt", "sync"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
