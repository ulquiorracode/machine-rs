[workspace]
members = [
    "crates/machine-core",
    "crates/machine-async",
    "crates/machine-derive",
    "crates/machine-rs",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["UlquiorraCode Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ulquiorracode/machine-rs"
keywords = ["state-machine", "fsm", "generators", "effects", "zero-cost"]
categories = ["rust-patterns", "asynchronous", "no-std"]

[workspace.dependencies]
machine-core = { path = "crates/machine-core", version = "0.1.0" }
machine-async = { path = "crates/machine-async", version = "0.1.0" }
machine-derive = { path = "crates/machine-derive", version = "0.1.0" }
machine-rs = { path = "crates/machine-rs", version = "0.1.0" }

syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

criterion = "0.8"
futures-core = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1.43", default-features = false, features = ["macros", "rt", "sync"] }
stitch-core = { git = "https://github.com/stitch-rs/stitch-framework.git", branch = "main", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
